<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZM-Check – USt-Prüfer</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>

  <header class="ts-header">
    <img src="src/assets/trusted-logo.png" alt="Logo" class="ts-header-logo" />
    <span class="ts-version">v0.1.0</span>
  </header>

  <main>
    <h1>ZM-Check – USt-Prüfer</h1>

    <!-- Drop-Zone: Klick öffnet Dateiauswahl, Drag-and-Drop legt Excel direkt ab -->
    <div class="ts-drop-zone" id="drop-zone">
      <label class="ts-zm-input-label" for="file-input">
        <span class="ts-zm-input-title">Liste analysieren</span>
        <span class="ts-zm-input-hint">oder Excel-Datei hier ablegen</span>
      </label>
      <input class="ts-zm-input" type="file" id="file-input" accept=".xlsx,.xls,.ods" />
    </div>

    <div class="ts-ust-progress-ctn" aria-live="polite"></div>

    <section class="ts-list-with-errors ts-hidden" aria-label="Fehlerhafte USt-Ids">
      <div class="ts-list-with-errors-title">Fehlerhafte USt-Ids</div>
      <table class="ts-list-with-errors-table">
        <thead>
          <tr>
            <th scope="col">USt-IdNr.</th>
            <th scope="col">Fehlermeldung</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="ts-event-log" id="event-log" aria-label="Protokoll">
      <div class="ts-event-log-header">
        <h2 class="ts-event-log-title">Protokoll</h2>
        <p class="ts-event-log-summary">Bereit – warte auf Excel-Datei …</p>
      </div>
      <div class="ts-event-log-list" role="log" aria-live="polite"></div>
    </section>
  </main>

</body>

</html>
