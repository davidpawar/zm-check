<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZM-Check – USt-Prüfer</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>

  <header class="ts-header">
    <img src="src/assets/trusted-logo.png" alt="Logo" class="ts-header-logo" />
    <span class="ts-version">v0.1.0</span>
  </header>

  <main>
    <h1>ZM-Check – USt-Prüfer</h1>

    <!-- Label fungiert als klickbarer Upload-Button; Input bleibt versteckt -->
    <label class="ts-zm-input-label" for="file-input">Liste analysieren</label>
    <input class="ts-zm-input" type="file" id="file-input" accept=".xlsx,.xls,.ods" />

    <div class="ts-ust-progress-ctn" aria-live="polite"></div>

    <section class="ts-list-with-errors ts-hidden" aria-label="Fehlerhafte USt-Ids">
      <div class="ts-list-with-errors-title">Fehlerhafte USt-Ids</div>
      <table class="ts-list-with-errors-table">
        <thead>
          <tr>
            <th scope="col">USt-IdNr.</th>
            <th scope="col">Fehlermeldung</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <details class="ts-event-log-details">
      <summary>Event-Log</summary>
      <div class="ts-event-log-ctn"></div>
    </details>
  </main>

</body>

</html>
